<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Calcola acquisto</title>
</head>
<body>

    <form id="formAcquisto">
        <label for="prodotto">Prodotto:</label>
        <input type="text" id="prodotto" required>
        <br>
        <label for="prezzo">Prezzo:</label>
        <input type="number" id="prezzo" min="0" step="0.01" required>
        <br>
        <label for="quantita">Quantità:</label>
        <input type="number" id="quantita" min="1" step="1" required>
        <br>
        <button type="submit">Calcola</button>
    </form>

    <p id="risultato"></p>

    <button id="eliminatutto">X all</button>
    <table id="tabella" border="3">
        <thead>
            <tr>
                <th>Prodotto</th>
                <th>Prezzo</th>
                <th>Q.tà</th>
                <th>Subtotale</th>
                <th>Sconto</th>
                <th>Totale</th>
                <th>Elimina</th>
            </tr>
        </thead>
        <tbody id="corpoTabella"></tbody>
    </table>

    <p id="totaleComplessivo"></p>

</body>
</html>
